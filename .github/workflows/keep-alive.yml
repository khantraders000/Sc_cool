name: Render Backend Keep Alive

on:
  schedule:
    - cron: "7,17,27,37,47,57 * * * *"
  workflow_dispatch:

jobs:
  keep-alive:
    runs-on: ubuntu-latest

    steps:
      - name: Ping Render Backend
        run: |
          echo "Pinging Render backend..."
          curl --fail --show-error --silent --max-time 60 \
            https://sc-cool.onrender.com/health
          echo ""
          echo "Backend ping successful"